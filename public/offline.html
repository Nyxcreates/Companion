<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Companion — Offline</title>
  <meta name="theme-color" content="#0b0b1e" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0b1e;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(94, 231, 224, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(124, 92, 255, 0.15) 0%, transparent 50%);
    }
    .container {
      max-width: 420px;
      width: 100%;
      background: rgba(18, 18, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 36px 28px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .avatar-wrapper {
      position: relative;
      margin-bottom: 24px;
    }
    .avatar-glow {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(94, 231, 224, 0.4) 0%, rgba(124, 92, 255, 0) 70%);
      animation: pulse 3s infinite ease-in-out;
    }
    .avatar {
      position: relative;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c5cff, #5ee7e0);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(124, 92, 255, 0.35);
    }
    .avatar svg {
      width: 36px;
      height: 36px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 0.9; }
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      color: #ffffff;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 11px;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 16px;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #f59e0b;
      box-shadow: 0 0 8px #f59e0b;
    }
    p {
      font-size: 13.5px;
      line-height: 1.6;
      color: #94a3b8;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px 20px;
      background: linear-gradient(135deg, #7c5cff, #6366f1);
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(124, 92, 255, 0.35);
      transition: all 0.2s ease;
    }
    .btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(124, 92, 255, 0.45);
    }
    .btn:active {
      transform: translateY(0);
    }
    .status-text {
      font-size: 11px;
      color: #64748b;
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="avatar-wrapper">
      <div class="avatar-glow"></div>
      <div class="avatar">
        <!-- Cloud / Star icon -->
        <svg viewBox="0 0 24 24">
          <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" />
        </svg>
      </div>
    </div>

    <h1>You&apos;re Offline</h1>
    <div class="badge">
      <span class="dot"></span>
      <span>Connection Paused</span>
    </div>

    <p>
      Nikki is resting while your device is disconnected from the internet. As soon as your connection returns, Companion will seamlessly wake back up.
    </p>

    <button id="retry-btn" class="btn" onclick="window.location.reload()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
        <path d="M3 3v5h5" />
        <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
        <path d="M16 21h5v-5" />
      </svg>
      <span>Try Reconnecting</span>
    </button>

    <p class="status-text">
      Auto-reconnecting as soon as Wi-Fi or mobile data returns
    </p>
  </div>

  <script>
    // Automatically reload as soon as network returns
    window.addEventListener("online", function () {
      const btn = document.getElementById("retry-btn");
      if (btn) btn.textContent = "Reconnecting...";
      setTimeout(function () {
        window.location.reload();
      }, 500);
    });
  </script>
</body>
</html>
